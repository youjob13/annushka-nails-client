<ann-profile-main class="section" [userData]="userData()!">
  <ann-user-data-form
    [userData]="userData()!"
    class="user-form"
  ></ann-user-data-form>
</ann-profile-main>

<div class="section apply-for-service">
  <h2 class="title" i18n>Apply for service right now</h2>

  <ann-service-application-form
    [services]="servicesService.getServices() | async"
    [requestInProgress]="!!(servicesService.requestInProgress$$ | async)"
    (send)="applyForService($event)"
  >
  </ann-service-application-form>
</div>
